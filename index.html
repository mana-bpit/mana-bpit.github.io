<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MANA STORE</title>
  <meta name="theme-color" content="#2B6684">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=Prompt:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Google Analytics 4: counts visits and button clicks on the live site only,
    // so local tests and the Editor preview do not add to the numbers.
    const GA_ID = 'G-F92222KFC5';
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // PDPA: no analytics cookies until the visitor accepts (Google Consent Mode).
    // The choice is remembered in this browser: 'granted' or 'denied'.
    const CONSENT_KEY = 'cookie-consent';
    const consent = (() => { try { return localStorage.getItem(CONSENT_KEY); } catch { return null; } })();
    gtag('consent', 'default', {
      analytics_storage: consent === 'granted' ? 'granted' : 'denied',
      ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied'
    });

    if (/\.github\.io$/i.test(location.hostname)) {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', GA_ID);
    }
  </script>
</head>
<body>
  <div id="page"></div>
  <div class="cookie-bar" id="cookie-bar" role="region" aria-label="การใช้คุกกี้" hidden>
    <p>เว็บนี้ใช้คุกกี้ (Google Analytics) เพื่อนับจำนวนผู้เข้าชมและการกดปุ่ม ช่วยให้เราปรับปรุงบริการได้ดีขึ้น</p>
    <div class="cookie-actions">
      <button type="button" class="cookie-no" data-consent="denied">ไม่ยอมรับ</button>
      <button type="button" class="cookie-yes" data-consent="granted">ยอมรับ</button>
    </div>
  </div>
  <script>
    // Show the cookie bar until the visitor chooses; then save the choice and hide it.
    // The "ตั้งค่าคุกกี้" link at the bottom of the page opens it again (see showCookieBar).
    const cookieBar = document.getElementById('cookie-bar');
    function showCookieBar() {
      cookieBar.hidden = false;
      document.body.classList.add('has-cookie-bar');
      cookieBar.querySelector('.cookie-yes').focus();
    }
    // Withdrawing consent also removes the Google Analytics cookies already saved
    function deleteGaCookies() {
      for (const c of document.cookie.split(';')) {
        const name = c.split('=')[0].trim();
        if (!name.startsWith('_ga')) continue;
        for (const domain of ['', '; domain=' + location.hostname, '; domain=.' + location.hostname])
          document.cookie = `${name}=; Max-Age=0; path=/${domain}`;
      }
    }
    cookieBar.addEventListener('click', e => {
      const choice = e.target.closest('[data-consent]')?.dataset.consent;
      if (!choice) return;
      try { localStorage.setItem(CONSENT_KEY, choice); } catch {}
      gtag('consent', 'update', { analytics_storage: choice });
      if (choice === 'denied') deleteGaCookies();
      cookieBar.hidden = true;
      document.body.classList.remove('has-cookie-bar');
    });
    if (!consent) showCookieBar();
  </script>
  <script src="render.js"></script>
  <script>
    // no-store so a new config.json shows at once after upload
    fetch('config.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(cfg => {
        const name = renderPage(cfg, document.getElementById('page'));
        if (name) document.title = name;
        // Small "ตั้งค่าคุกกี้" link under the footer, so visitors can change their choice
        const settings = document.createElement('button');
        settings.type = 'button';
        settings.className = 'cookie-settings';
        settings.textContent = 'ตั้งค่าคุกกี้';
        settings.addEventListener('click', showCookieBar);
        document.querySelector('.lp-footer')?.after(settings);
        if (location.hash === '#contacts') document.querySelector('a[href="#contacts"]')?.click();
      })
      .catch(() => {
        document.getElementById('page').textContent = 'Cannot load config.json';
      });

    // One "link_click" event per tap, named by the button, so reports read
    // "ช้อปที่ Shopee" instead of a web address.
    document.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      let label = '';
      if (a.matches('.lp-link')) label = a.querySelector('.lp-label')?.textContent || '';
      else if (a.matches('.lp-social')) label = a.getAttribute('aria-label') || '';
      else if (a.matches('.lp-call')) label = 'โทร ' + (a.querySelector('.lp-call-name')?.textContent || a.href);
      else if (a.matches('.lp-promo-cta')) label = 'โปรโมชัน';
      else return;
      gtag('event', 'link_click', {
        link_label: label.trim(),
        link_url: a.getAttribute('href'),
        transport_type: 'beacon'
      });
    });
  </script>
</body>
</html>
